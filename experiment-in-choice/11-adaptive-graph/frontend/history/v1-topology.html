<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNBOUND NET // CELLULAR GRAPH TOPOGRAPHY</title>
    <style>
        body, html { margin: 0; padding: 0; background: #030306; overflow: hidden; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; color: #00FF66; }
        #workspace-frame { position: relative; width: 780px; padding: 25px; background: #08080E; border: 1px solid #142814; box-shadow: 0 0 30px rgba(0, 255, 102, 0.08); border-radius: 6px; }
        .hud-header { color: #00FF66; font-size: 11px; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1.5px; border-bottom: 1px solid #142814; padding-bottom: 8px; text-shadow: 0 0 5px #00FF66; }
        
        /* Master Network Diagram Frame */
        #viewport-container { position: relative; width: 100%; height: 380px; background: #010103; border: 1px solid #142814; border-radius: 4px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }

        /* General Metrics Card Array */
        #telemetry-deck { margin-top: 25px; padding-top: 15px; border-top: 1px solid #142814; display: flex; justify-content: space-between; font-size: 11px; color: #446644; }
        .data-point { color: #00FF66; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,102,0.3); }
        .data-point.alert { color: #FF0055; text-shadow: 0 0 5px rgba(255,0,85,0.4); }
    </style>
</head>
<body>

    <div id="workspace-frame">
        <div class="hud-header">
            [ADAPTIVE GRAPH-STRUCTURED AUTOMATA MONITOR] // TICK <span id="tick-val" style="color:#FFF;">0</span>
        </div>
        
        <div id="viewport-container">
            <canvas id="mesh-canvas"></canvas>
        </div>

        <div id="telemetry-deck">
            <div>NETWORK DENSITY ENTROPY: <span id="ent-val" class="data-point">0.0000</span></div>
            <div>TOPOLOGY FORMAT: NON-LINEAR MULTI-AGENT MESH</div>
            <div>STATUS: <span id="status-val" class="data-point">COHERENT</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mesh-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const socket = new WebSocket('ws://localhost:8080/graph-stream');

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            document.getElementById('tick-val').innerText = data.lifecycleTick;
            document.getElementById('ent-val').innerText = data.networkEntropy.toFixed(4);

            const statusField = document.getElementById('status-val');
            const entField = document.getElementById('ent-val');
            
            // Assess structural phase changes based on topology density
            const isHighEntropy = data.networkEntropy > 0.08;
            if (isHighEntropy) {
                statusField.innerText = "PHASE DRIFT IN STABILITY";
                statusField.className = "data-point alert";
                entField.className = "data-point alert";
            } else {
                statusField.innerText = "COHERENT INTERLOCK";
                statusField.className = "data-point";
                entField.className = "data-point";
            }

            renderNetworkTopology(data.nodesPotential, data.edgeMatrix, isHighEntropy);
        };

        function renderNetworkTopology(potentials, edgeMatrix, unstable) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = 130;
            const size = potentials.length;

            // Compute circular layout mappings for the 40 floating nodes
            const nodePositions = [];
            for (let i = 0; i < size; i++) {
                const angle = (i * 2 * Math.PI) / size;
                nodePositions.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius
                });
            }

            // Phase 1: Draw dynamic synaptic edge links
            for (let i = 0; i < size; i++) {
                const neighbors = edgeMatrix[i];
                if (!neighbors) continue;
                
                const startPos = nodePositions[i];
                neighbors.forEach(nIdx => {
                    if (nIdx < i) return; // Prevent double line tracing sweeps
                    const endPos = nodePositions[nIdx];
                    
                    ctx.beginPath();
                    ctx.moveTo(startPos.x, startPos.y);
                    ctx.lineTo(endPos.x, endPos.y);
                    
                    // Modulate connection opacity based on synchronization parameters
                    const alignment = 1.0 - Math.abs(potentials[i] - potentials[nIdx]);
                    ctx.lineWidth = alignment * 1.5;
                    
                    if (unstable) {
                        ctx.strokeStyle = `rgba(255, 0, 85, ${alignment * 0.4})`;
                    } else {
                        ctx.strokeStyle = `rgba(0, 255, 102, ${alignment * 0.25})`;
                    }
                    ctx.stroke();
                });
            }

            // Phase 2: Draw individual somatic agent boundaries
            for (let i = 0; i < size; i++) {
                const pos = nodePositions[i];
                const pot = potentials[i];

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 4 + (pot * 4), 0, Math.PI * 2);
                ctx.fillStyle = "#010103";
                ctx.fill();

                if (unstable) {
                    ctx.strokeStyle = `rgba(255, 0, 85, ${0.4 + (pot * 0.6)})`;
                } else {
                    ctx.strokeStyle = `rgba(0, 255, 102, ${0.4 + (pot * 0.6)})`;
                }
                ctx.lineWidth = 1 + (pot * 2);
                ctx.stroke();
            }
        }

        socket.onclose = () => {
            document.getElementById('status-val').innerHTML = "<span style='color:#FF0055;'>DECOHERENCE // CHANNELS severed</span>";
        };
    </script>
</body>
</html>
