apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound-matrix-deployment
  namespace: default
  labels:
    app: unbound-matrix
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unbound-matrix
  template:
    metadata:
      labels:
        app: unbound-matrix
    spec:
      containers:
      - name: simulation-node
        image: unbound-matrix:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command:
            - pgrep
            - python
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: unbound-matrix-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: unbound-matrix
