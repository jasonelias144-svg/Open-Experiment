<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE LIVING KERNEL // TELEMETRY NETWORK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; background: #030306; color: #D1D1E0; font-family: monospace; overflow: hidden; }
        #matrix-grid { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
        
        /* Left Metrics Drawer Layout */
        #telemetry-sidebar { background: #09090F; border-right: 1px solid #1F1F35; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .hud-header { color: #8F66FF; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
        .metric-card { background: #0E0E1B; border: 1px solid #1F1F35; padding: 12px; border-radius: 4px; }
        .metric-bar-bg { background: #040408; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 6px; }
        .metric-bar-fill { height: 100%; background: #00FFBB; width: 0%; transition: width 0.15s ease; }
        
        /* Main Action Workspace */
        #display-nexus { display: flex; flex-direction: column; padding: 25px; gap: 20px; background: #030306; }
        #canvas-frame { flex: 1; background: #010103; border: 1px solid #1F1F35; border-radius: 6px; position: relative; overflow: hidden; }
        #token-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; color: #00FFBB; font-weight: bold; text-shadow: 0 0 25px rgba(0, 255, 187, 0.6); font-family: monospace; letter-spacing: 4px; transition: all 0.1s ease; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #overlay-hud-text { position: absolute; bottom: 20px; left: 20px; color: #00A8FF; text-shadow: 0 0 5px #00A8FF; font-size: 14px; }
    </style>
</head>
<body>

    <div id="matrix-grid">
        <!-- Sidebar Metrics Ingress -->
        <div id="telemetry-sidebar">
            <div class="hud-header">[The Seven Fields Matrix]</div>
            <div class="metric-card"><h5>1. Physical Plane</h5><div class="metric-bar-bg"><div id="bar-Physical" class="metric-bar-fill"></div></div></div>
            <div class="metric-card"><h5>2. Epistemic Plane</h5><div class="metric-bar-bg"><div id="bar-Epistemic" class="metric-bar-fill"></div></div></div>
            <div class="metric-card"><h5>3. Relational Plane</h5><div class="metric-bar-bg"><div id="bar-Relational" class="metric-bar-fill"></div></div></div>
            <div class="metric-card"><h5>4. Developmental Plane</h5><div class="metric-bar-bg"><div id="bar-Developmental" class="metric-bar-fill"></div></div></div>
            <div class="metric-card"><h5>5. Universal Plane</h5><div class="metric-bar-bg"><div id="bar-Universal" class="metric-bar-fill"></div></div></div>
        </div>

        <!-- Central Workspace Field -->
        <div id="display-nexus">
            <div id="canvas-frame">
                <canvas id="matrix-canvas"></canvas>
                <div id="token-overlay">(💎)</div>
                <div id="overlay-hud-text">
                    HEARTBEAT TICK: <span id="hb-val" style="color:#FFF;">0</span> // 
                    ANOMALY COUNT: <span id="an-val" style="color:#FF0055;">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        const tokenOverlay = document.getElementById('token-overlay');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const socket = new WebSocket('ws://localhost:8080/kernel-stream');

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            document.getElementById('hb-val').innerText = data.heartbeat;
            document.getElementById('an-val').innerText = data.anomaliesCount;
            tokenOverlay.innerText = data.activeWrapper;

            // Trigger structural screen modifications if a custom sequence trigger occurs
            if (data.activeWrapper.includes("🥷")) {
                tokenOverlay.style.color = "#FF0055";
                tokenOverlay.style.textShadow = "0 0 35px #FF0055";
            } else {
                tokenOverlay.style.color = "#00FFBB";
                tokenOverlay.style.textShadow = "0 0 25px rgba(0, 255, 187, 0.6)";
            }

            // Sync visual bar metrics lengths
            for (let name in data.planeMetrics) {
                const element = document.getElementById(`bar-${name}`);
                if (element) {
                    element.style.width = `${data.planeMetrics[name] * 100}%`;
                }
            }

            drawWave(data.planeMetrics, data.activeAperture);
        };

        function drawWave(metrics, aperture) {
            ctx.fillStyle = 'rgba(3, 3, 6, 0.2)'; // Persistent frame trailing decay multiplier
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerY = canvas.height / 2;
            ctx.beginPath();
            ctx.lineWidth = 1.5 + (aperture * 4);
            ctx.strokeStyle = aperture > 0.18 ? '#FF0055' : '#00A8FF';

            // Generate an organic waveform mapping out active vector metrics along the horizontal grid space
            for (let x = 0; x < canvas.width; x += 5) {
                const angle = (x * 0.01) + (metrics["Physical"] * 10);
                const y = centerY + (Math.sin(angle) * (metrics["Relational"] * 120));
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
